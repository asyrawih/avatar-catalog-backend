name: avatar-catalog

services:
  db:
    # pgvector/pgvector = postgres resmi + extension vector; dibutuhkan kolom
    # OUTFIT.name_embedding. Volume data dari image postgres:17 tetap kompatibel.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avatar_catalog}
      POSTGRES_USER: ${POSTGRES_USER:-avatar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avatar_dev_password}
      # Bikin initdb tegas soal encoding dan collation supaya urutan teks sama
      # di semua mesin developer.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Skrip di sini hanya jalan saat volume masih kosong. Untuk memuat ulang
      # skema: docker compose down -v && docker compose up.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avatar} -d ${POSTGRES_DB:-avatar_catalog}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Cache boleh hilang kapan saja, jadi persistensi dimatikan dan memori
    # dibatasi: begitu penuh, kunci paling jarang dipakai dibuang sendiri.
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-avatar}:${POSTGRES_PASSWORD:-avatar_dev_password}@db:5432/${POSTGRES_DB:-avatar_catalog}?sslmode=disable
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL: ${CACHE_TTL:-1m}
      CACHE_PREFIX: ${CACHE_PREFIX:-avatar-catalog}
      AUTH_TOKENS: ${AUTH_TOKENS:-}
    # Trafik publik lewat caddy. Port ini hanya dibuka ke loopback host supaya
    # curl langsung ke api masih bisa saat debug.
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"

  # Hanya jalan dengan `docker compose --profile edge up`. Di server yang sudah
  # punya reverse proxy sendiri, biarkan mati dan pakai
  # docker-compose.server.yml supaya api nempel ke proxy yang ada.
  caddy:
    image: caddy:2-alpine
    profiles: [edge]
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # ":80" = lokal tanpa TLS. Isi domain (mis. api.contoh.com) untuk
      # sertifikat Let's Encrypt otomatis.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-hanan@kelasmalam.app}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Sertifikat harus persisten, kalau tidak Let's Encrypt kena rate limit
      # setiap kali container dibuat ulang.
      - caddy_data:/data
      - caddy_config:/config

  # Profil tools: `docker compose --profile tools up` kalau butuh lihat isi tabel.
  adminer:
    image: adminer:5
    profiles: [tools]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8081}:8080"

volumes:
  pgdata:
  caddy_data:
  caddy_config:
