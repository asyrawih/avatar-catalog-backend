# Setelan non-rahasia untuk api. Nilainya sejajar dengan .env.example; yang
# rahasia (password Postgres, AUTH_TOKENS) ada di Secret terpisah.
apiVersion: v1
kind: ConfigMap
metadata:
  name: avatar-catalog-config
  labels:
    app.kubernetes.io/part-of: avatar-catalog
data:
  APP_ENV: "production"
  HOST: "0.0.0.0"
  PORT: "8080"
  LOG_LEVEL: "info"

  # Postgres dipakai (DATABASE_URL diisi di Deployment), jadi seed in-memory mati.
  SEED_DATA: "false"

  DB_MAX_CONNS: "10"
  DB_MIN_CONNS: "2"
  DB_CONNECT_TIMEOUT: "10s"

  CACHE_TTL: "1m"
  CACHE_PREFIX: "avatar-catalog"

  IDEMPOTENCY_TTL: "24h"
  # Harus lebih pendek dari terminationGracePeriodSeconds di Deployment api.
  SHUTDOWN_TIMEOUT: "10s"

  # Nama database dan user Postgres. Password ada di Secret.
  POSTGRES_DB: "avatar_catalog"
  POSTGRES_USER: "avatar"
