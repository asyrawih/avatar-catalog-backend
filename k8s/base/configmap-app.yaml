# Setelan non-rahasia untuk api. Nilainya sejajar dengan .env.example; yang
# rahasia (password Postgres) ada di Secret terpisah, dan kunci API ada di
# tabel api_key — bukan di sini maupun di Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: avatar-catalog-config
  labels:
    app.kubernetes.io/part-of: avatar-catalog
data:
  APP_ENV: "production"
  HOST: "0.0.0.0"
  PORT: "8080"
  LOG_LEVEL: "info"

  # Postgres dipakai (DATABASE_URL diisi di Deployment), jadi seed in-memory mati.
  SEED_DATA: "false"

  DB_MAX_CONNS: "10"
  DB_MIN_CONNS: "2"
  DB_CONNECT_TIMEOUT: "10s"

  CACHE_TTL: "1m"
  CACHE_PREFIX: "avatar-catalog"

  IDEMPOTENCY_TTL: "24h"
  # Harus lebih pendek dari terminationGracePeriodSeconds di Deployment api.
  SHUTDOWN_TIMEOUT: "10s"

  # Setiap request /v1 wajib membawa kunci API yang sah. Kunci-kuncinya ada di
  # tabel api_key, bukan di sini — diterbitkan dan dicabut dengan cmd/apikey
  # tanpa perlu redeploy. Jangan diubah jadi "false" di lingkungan mana pun
  # yang bisa dijangkau dari luar.
  AUTH_REQUIRED: "true"

  # Batas request per detik PER KUNCI API.
  #
  # Dihitung per proses, bukan per cluster: dengan replicas: 2 di base, batas
  # efektif satu kunci jadi 2 x nilai ini. Bagi dulu kalau yang dimaksud batas
  # gabungan — atau naikkan sadar-sadar kalau memang per-pod yang diinginkan.
  RATE_LIMIT_PER_SECOND: "50"

  # Nama database dan user Postgres. Password ada di Secret.
  POSTGRES_DB: "avatar_catalog"
  POSTGRES_USER: "avatar"
