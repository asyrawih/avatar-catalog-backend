apiVersion: v1
kind: Service
metadata:
  name: avatar-catalog-api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: avatar-catalog
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: avatar-catalog
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: avatar-catalog-api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: avatar-catalog
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/part-of: avatar-catalog
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: avatar-catalog
    spec:
      # SHUTDOWN_TIMEOUT (10s) harus muat di dalam angka ini.
      terminationGracePeriodSeconds: 30
      securityContext:
        # uid/gid nonroot di gcr.io/distroless/static-debian12:nonroot.
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: api
                    app.kubernetes.io/part-of: avatar-catalog
      initContainers:
        # Server gagal cepat kalau Postgres belum bisa dihubungi saat start, lalu
        # keluar dengan status 1. Tanpa penjaga ini, pod api pada deploy pertama
        # masuk CrashLoopBackOff sampai database siap — akhirnya jalan sendiri,
        # tapi jejaknya berupa restart beruntun dan pod Error yang terlihat
        # persis seperti kerusakan sungguhan.
        #
        # compose menyelesaikannya dengan depends_on: service_healthy; di
        # Kubernetes tidak ada padanannya, jadi penantiannya ditulis di sini.
        #
        # Memakai image yang sama dengan StatefulSet db supaya tidak menambah
        # image yang harus ditarik, dan pg_isready adalah pemeriksaan yang tepat
        # — bukan sekadar port terbuka, tapi Postgres benar-benar siap menerima
        # koneksi.
        - name: tunggu-postgres
          image: pgvector/pgvector:pg17
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h avatar-catalog-db -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                echo "menunggu postgres siap..."
                sleep 2
              done
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: avatar-catalog-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: avatar-catalog-config
                  key: POSTGRES_DB
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      containers:
        - name: api
          # Tag diganti per-lingkungan lewat `images:` di overlay.
          image: ghcr.io/asyrawi/avatar-catalog-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: avatar-catalog-config
          env:
            # Didefinisikan eksplisit dan berurutan karena DATABASE_URL di
            # bawah merujuk ketiganya lewat $(VAR) — ekspansi hanya melihat
            # entri `env`, bukan yang datang dari envFrom.
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: avatar-catalog-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: avatar-catalog-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: avatar-catalog-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@avatar-catalog-db:5432/$(POSTGRES_DB)?sslmode=disable
            - name: REDIS_URL
              value: redis://avatar-catalog-redis:6379/0
          # Image distroless tanpa shell/curl, jadi semua probe lewat HTTP.
          # healthz cukup membuktikan proses hidup; readyz ikut memeriksa
          # Postgres dan Redis, jadi hanya dipakai readiness — bukan liveness,
          # supaya database yang sedang ngadat tidak memicu restart beruntun.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
