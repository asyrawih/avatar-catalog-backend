# Nilai bawaan HANYA untuk dev/lokal. Untuk produksi jangan pakai file ini
# apa adanya — lihat k8s/README.md bagian "Secret di produksi".
#
# Catatan URL-encoding: POSTGRES_PASSWORD ikut disusun jadi DATABASE_URL di
# Deployment api. Hindari karakter @ : / ? # & di password — kalau terpaksa
# dipakai, timpa DATABASE_URL utuh lewat patch di overlay (lihat README).
apiVersion: v1
kind: Secret
metadata:
  name: avatar-catalog-secret
  labels:
    app.kubernetes.io/part-of: avatar-catalog
type: Opaque
stringData:
  POSTGRES_PASSWORD: "avatar_dev_password"

# Kunci API TIDAK ada di sini. Kunci konsumen (Roblox, dashboard, AI) hidup di
# tabel api_key sebagai hash, diterbitkan dengan cmd/apikey — lihat
# docs/auth.md. Menaruhnya di Secret berarti rotasi butuh redeploy, dan
# tokennya tersimpan dalam bentuk yang masih bisa dipakai.
