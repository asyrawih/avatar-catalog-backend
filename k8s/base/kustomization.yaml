apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: avatar-catalog

commonLabels:
  app.kubernetes.io/part-of: avatar-catalog

resources:
  - namespace.yaml
  - configmap-app.yaml
  - secret-app.yaml
  - postgres.yaml
  - redis.yaml
  - api.yaml
  - ingress.yaml

# migrate-job.yaml SENGAJA tidak disebut di sini. Job bersifat immutable
# setelah dibuat (spec.template tidak bisa diubah), jadi kubectl apply -k akan
# gagal begitu Job sebelumnya sudah selesai. deploy.sh mengelola Job ini
# sendiri: hapus yang lama, lalu buat yang baru, di setiap deploy.
