# Cluster lokal sering sempit; turunkan request supaya pod tetap terjadwal.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: avatar-catalog-api
spec:
  template:
    spec:
      containers:
        - name: api
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
