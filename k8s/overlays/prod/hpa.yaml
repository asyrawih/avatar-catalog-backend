# Butuh metrics-server terpasang di cluster.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: avatar-catalog-api
  labels:
    app.kubernetes.io/name: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: avatar-catalog-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Turun pelan supaya lonjakan trafik yang naik-turun tidak bikin pod
      # dibunuh lalu dibuat lagi terus-menerus.
      stabilizationWindowSeconds: 300
