apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Resource tambahan di overlay ini (HPA, PDB, CRD Traefik) tidak mewarisi
# namespace dari base — harus disebut lagi di sini.
namespace: avatar-catalog

resources:
  - ../../base
  - hpa.yaml
  - pdb.yaml

images:
  - name: ghcr.io/asyrawih/avatar-catalog-backend
    # Ganti ke digest atau tag rilis; `latest` bikin rollback tidak jelas.
    newTag: v0.1.0

# Angka awal saja — begitu HPA aktif, dia yang memegang replicas.
replicas:
  - name: avatar-catalog-api
    count: 3

patches:
  - path: patch-ingress.yaml
